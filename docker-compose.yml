version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: poc_concurrency_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poc_concurrency
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: node:20-alpine
    container_name: poc_concurrency_backend
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    volumes:
      - ./backend-nestjs:/app
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: poc_concurrency
      PGUSER: postgres
      PGPASSWORD: postgres
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
